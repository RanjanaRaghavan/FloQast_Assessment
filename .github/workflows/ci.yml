name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels an in-progress run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_ENV: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Read the Node version from .nvmrc — the same file `nvm use` reads
          # locally, so CI and every contributor run the same runtime.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run tests
        # Playwright's webServer block boots the mock stack and waits on /health;
        # globalSetup then resets it. No services to stand up here.
        run: npx playwright test

      - name: Upload report and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            reports/
            test-results/
          retention-days: 7
          if-no-files-found: warn
